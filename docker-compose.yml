services:
  web:
    build: .
    env_file:
      - .env
    environment:
      # Do not inherit NODE_OPTIONS from .env — that 10GB cap is for the feed worker.
      # Web + feed both at 10GB on a 15GB box is what OOM-killed next-server today.
      # 8GB: feed snapshot rebuild (cron exec web) OOM'd at 4GB on ~983k rows.
      - NODE_OPTIONS=${WEB_NODE_OPTIONS:---max-old-space-size=8192}
      - GALAXUS_FEED_RUN_ON=${GALAXUS_FEED_RUN_ON:-worker}
      - PLAYWRIGHT_USE_XVFB=${PLAYWRIGHT_USE_XVFB:-1}
      - PLAYWRIGHT_ENABLE_REMOTE_DESKTOP=${PLAYWRIGHT_ENABLE_REMOTE_DESKTOP:-1}
      - VNC_PASSWORD=${VNC_PASSWORD:-1234}
      # Needed so cron/exec Playwright headed refresh can find the entrypoint Xvfb.
      - DISPLAY=${DISPLAY:-:99}
    ports:
      - "3000:3000"
      # Remote desktop reaches the internet only through the TLS-terminated /stockx-vnc/ proxy.
      - "127.0.0.1:6080:6080"
    volumes:
      # Host bind mount: StockX Chromium profiles + tokens survive image recreate/deploy.
      # Paths: .data/stockx-profile, .data/stockx-profile-galaxus, .data/stockx-token*.json
      - ./.data:/app/.data
      # Host `.env` on disk (same as `env_file`) so `next start` always sees PARTNER_* etc.
      - ./.env:/app/.env:ro
    restart: unless-stopped

  worker-partner-enrich:
    build: .
    env_file:
      - .env
    environment:
      - WORKER_JOB_TYPE=partner-upload-enrich
      - WORKER_POLL_MS=${WORKER_POLL_MS:-2000}
      - WORKER_GROUP_LIMIT=${WORKER_GROUP_LIMIT:-1}
      - WORKER_STALE_MS=${WORKER_STALE_MS:-900000}
      - WORKER_HEARTBEAT_MS=${WORKER_HEARTBEAT_MS:-60000}
    command: ["npx", "tsx", "scripts/workers/partnerEnrichWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-partner-csv-import:
    build: .
    env_file:
      - .env
    environment:
      - WORKER_JOB_TYPE=partner-csv-import
      - WORKER_POLL_MS=${WORKER_POLL_MS:-2000}
      - WORKER_GROUP_LIMIT=${WORKER_GROUP_LIMIT:-1}
      - WORKER_STALE_MS=${WORKER_STALE_MS:-900000}
      - WORKER_HEARTBEAT_MS=${WORKER_HEARTBEAT_MS:-60000}
    command: ["npx", "tsx", "scripts/workers/partnerCsvImportWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-kickdb-enrich:
    build: .
    env_file:
      - .env
    environment:
      - WORKER_JOB_TYPE=kickdb-enrich-missing
      - WORKER_POLL_MS=${WORKER_POLL_MS:-2000}
      - WORKER_GROUP_LIMIT=${WORKER_GROUP_LIMIT:-1}
      - WORKER_STALE_MS=${WORKER_STALE_MS:-900000}
      - WORKER_HEARTBEAT_MS=${WORKER_HEARTBEAT_MS:-60000}
    command: ["npx", "tsx", "scripts/workers/kickdbEnrichWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-stx-import-slugs:
    build: .
    env_file:
      - .env
    environment:
      - WORKER_JOB_TYPE=stx-import-slugs-sync
      - WORKER_POLL_MS=${WORKER_POLL_MS:-2000}
      - WORKER_GROUP_LIMIT=${WORKER_GROUP_LIMIT:-6}
      - WORKER_STALE_MS=${WORKER_STALE_MS:-900000}
      - WORKER_HEARTBEAT_MS=${WORKER_HEARTBEAT_MS:-60000}
      - STX_IMPORT_SYNC_CONCURRENCY=${STX_IMPORT_SYNC_CONCURRENCY:-6}
      - STX_IMPORT_SYNC_BATCH_SIZE=${STX_IMPORT_SYNC_BATCH_SIZE:-120}
    command: ["npx", "tsx", "scripts/workers/stxImportSlugsWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-shopify-sold-check:
    build: .
    env_file:
      - .env
    environment:
      - SHOPIFY_SOLD_CHECK_INTERVAL_MS=${SHOPIFY_SOLD_CHECK_INTERVAL_MS:-172800000}
      - SHOPIFY_SOLD_CHECK_INITIAL_DELAY_MS=${SHOPIFY_SOLD_CHECK_INITIAL_DELAY_MS:-60000}
    command: ["npx", "tsx", "scripts/workers/shopifySoldCheckWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-galaxus-edi:
    build: .
    env_file:
      - .env
    environment:
      - TZ=Europe/Zurich
      # Next `server-only` throws under raw tsx; stub so EDI can import supplier/orders.
      - NODE_OPTIONS=--require ./scripts/workers/stubServerOnly.cjs
      - GALAXUS_EDI_WORKER_LOOP_MS=${GALAXUS_EDI_WORKER_LOOP_MS:-15000}
      - GALAXUS_EDI_DIRECT_INTERVAL_MS=${GALAXUS_EDI_DIRECT_INTERVAL_MS:-300000}
      - GALAXUS_EDI_WAREHOUSE_HOUR=${GALAXUS_EDI_WAREHOUSE_HOUR:-12}
      - GALAXUS_EDI_WAREHOUSE_MINUTE=${GALAXUS_EDI_WAREHOUSE_MINUTE:-5}
      - GALAXUS_EDI_DIRECT_SFTP_TIMEOUT_MS=${GALAXUS_EDI_DIRECT_SFTP_TIMEOUT_MS:-120000}
      - GALAXUS_EDI_WAREHOUSE_SFTP_TIMEOUT_MS=${GALAXUS_EDI_WAREHOUSE_SFTP_TIMEOUT_MS:-600000}
      - GALAXUS_EDI_WORKER_INITIAL_DELAY_MS=${GALAXUS_EDI_WORKER_INITIAL_DELAY_MS:-5000}
    command: ["npx", "tsx", "scripts/workers/galaxusEdiWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-galaxus-feed:
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=${GALAXUS_FEED_NODE_OPTIONS:---max-old-space-size=10240}
      - GALAXUS_FEED_RUN_ON=worker
      - GALAXUS_FEED_WORKER=1
      - GALAXUS_FEED_WORKER_POLL_MS=${GALAXUS_FEED_WORKER_POLL_MS:-30000}
      - GALAXUS_FEED_WORKER_ORIGIN=${GALAXUS_FEED_WORKER_ORIGIN:-http://127.0.0.1:3000}
      - GALAXUS_FEED_STALE_MINUTES=${GALAXUS_FEED_STALE_MINUTES:-45}
      - GALAXUS_PAUSE_HEAVY_FEEDS=${GALAXUS_PAUSE_HEAVY_FEEDS:-0}
    command: ["npx", "tsx", "scripts/workers/galaxusFeedWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    depends_on:
      - web

  worker-kickdb-buffer:
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=${KICKDB_BUFFER_NODE_OPTIONS:---max-old-space-size=4096}
      - KICKDB_BUFFER_PORT=3002
      - KICKDB_BUFFER_HOST=0.0.0.0
    command: ["npx", "tsx", "scripts/workers/kickdbBufferServer.ts"]
    ports:
      - "3002:3002"
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-ops-background:
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=${OPS_BACKGROUND_NODE_OPTIONS:---max-old-space-size=8192}
      - WORKER_POLL_MS=${OPS_BACKGROUND_POLL_MS:-3000}
      # STX shards ~15–20 min; keep above that so live jobs not marked stale mid-run.
      - WORKER_STALE_MS=${OPS_BACKGROUND_STALE_MS:-3600000}
      - GALAXUS_FEED_WORKER_ORIGIN=${GALAXUS_FEED_WORKER_ORIGIN:-http://127.0.0.1:3000}
      # STX price/stock shards — keep under ~1h so pooler stays alive.
      - STX_REFRESH_PRODUCT_BATCH=${STX_REFRESH_PRODUCT_BATCH:-8000}
      - STX_REFRESH_CONCURRENCY=${STX_REFRESH_CONCURRENCY:-4}
    command: ["npx", "tsx", "scripts/workers/opsBackgroundWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped
    depends_on:
      - web

  worker-shopify-stx-price-sync:
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=${SHOPIFY_STX_SYNC_NODE_OPTIONS:---max-old-space-size=2048}
      - SHOPIFY_STX_SYNC_INTERVAL_MS=${SHOPIFY_STX_SYNC_INTERVAL_MS:-3600000}
      - SHOPIFY_STX_SYNC_INITIAL_DELAY_MS=${SHOPIFY_STX_SYNC_INITIAL_DELAY_MS:-120000}
      - SHOPIFY_STX_SYNC_BATCH_SIZE=${SHOPIFY_STX_SYNC_BATCH_SIZE:-50}
      - SHOPIFY_STX_SYNC_BATCH_SLEEP_MS=${SHOPIFY_STX_SYNC_BATCH_SLEEP_MS:-1500}
      - SHOPIFY_STX_SYNC_ONLY_ON_SHOPIFY=${SHOPIFY_STX_SYNC_ONLY_ON_SHOPIFY:-1}
      - SHOPIFY_API_RESERVE_POINTS=${SHOPIFY_STX_SYNC_API_RESERVE_POINTS:-800}
    command: ["npx", "tsx", "scripts/workers/shopifyStxPriceSyncWorker.ts"]
    volumes:
      - ./.data:/app/.data
    restart: unless-stopped

  worker-shopify-fast-reprice:
    build: .
    env_file:
      - .env
    environment:
      - NODE_OPTIONS=${SHOPIFY_FAST_REPRICE_NODE_OPTIONS:---max-old-space-size=2048}
      - SHOPIFY_FAST_REPRICE_SHARDS=${SHOPIFY_FAST_REPRICE_SHARDS:-1}
      - SHOPIFY_FAST_REPRICE_PAUSE_MS=${SHOPIFY_FAST_REPRICE_PAUSE_MS:-1800000}
      - SHOPIFY_FAST_REPRICE_SKIP_FRESH_HOURS=${SHOPIFY_FAST_REPRICE_SKIP_FRESH_HOURS:-6}
      - SHOPIFY_FAST_REPRICE_INITIAL_DELAY_MS=${SHOPIFY_FAST_REPRICE_INITIAL_DELAY_MS:-60000}
      - SHOPIFY_FAST_REPRICE_DRIFT_PAUSE_MS=${SHOPIFY_FAST_REPRICE_DRIFT_PAUSE_MS:-900000}
      - SHOPIFY_FAST_REPRICE_DRIFT_MAX_PRODUCTS=${SHOPIFY_FAST_REPRICE_DRIFT_MAX_PRODUCTS:-500}
      - SHOPIFY_FAST_REPRICE_VERIFY_PAUSE_MS=${SHOPIFY_FAST_REPRICE_VERIFY_PAUSE_MS:-21600000}
      - SHOPIFY_STX_STOCK_RECONCILE_AT=${SHOPIFY_STX_STOCK_RECONCILE_AT-03:00}
      - SHOPIFY_API_RESERVE_POINTS=${SHOPIFY_FAST_REPRICE_API_RESERVE_POINTS:-800}
      - SHOPIFY_API_METRICS_LOG_MS=${SHOPIFY_FAST_REPRICE_API_METRICS_LOG_MS:-300000}
    command: ["npx", "tsx", "scripts/workers/shopifyFastRepriceWorker.ts"]
    restart: unless-stopped

  # Server-side Google Tag Manager — OFF by default (docs/tracking/SGTM-VPS.md).
  # Profile "sgtm": `docker compose config --services` (deploy script) skips these until the
  # VPS .env sets COMPOSE_PROFILES=sgtm + SGTM_CONTAINER_CONFIG. No env_file on purpose:
  # the tagging server must never see app secrets. Localhost-only; host nginx terminates TLS.
  sgtm-tagging:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:${SGTM_IMAGE_TAG:-stable}
    profiles: ["sgtm"]
    pull_policy: missing
    environment:
      - CONTAINER_CONFIG=${SGTM_CONTAINER_CONFIG:-}
      - PREVIEW_SERVER_URL=${SGTM_PREVIEW_SERVER_URL:-https://sgtm-preview.resell-lausanne.ch}
      - PORT=8080
    ports:
      - "127.0.0.1:${SGTM_TAGGING_PORT:-8090}:8080"
    mem_limit: ${SGTM_TAGGING_MEM_LIMIT:-768m}
    cpus: ${SGTM_TAGGING_CPUS:-1.5}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    restart: unless-stopped
    depends_on:
      - sgtm-preview

  sgtm-preview:
    image: gcr.io/cloud-tagging-10302018/gtm-cloud-image:${SGTM_IMAGE_TAG:-stable}
    profiles: ["sgtm"]
    pull_policy: missing
    environment:
      - CONTAINER_CONFIG=${SGTM_CONTAINER_CONFIG:-}
      - RUN_AS_PREVIEW_SERVER=true
      - PORT=8080
    ports:
      - "127.0.0.1:${SGTM_PREVIEW_PORT:-8091}:8080"
    mem_limit: ${SGTM_PREVIEW_MEM_LIMIT:-384m}
    cpus: ${SGTM_PREVIEW_CPUS:-0.5}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
