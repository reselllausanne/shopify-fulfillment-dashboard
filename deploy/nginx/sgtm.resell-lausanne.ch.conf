# Server-side GTM — host nginx vhosts (template, NOT active).
# Install only at Gate G2 (docs/tracking/SGTM-VPS.md):
#   sudo cp deploy/nginx/sgtm.resell-lausanne.ch.conf /etc/nginx/sites-available/sgtm
#   sudo ln -s /etc/nginx/sites-available/sgtm /etc/nginx/sites-enabled/sgtm
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d sgtm.resell-lausanne.ch -d sgtm-preview.resell-lausanne.ch
# certbot adds the 443/ssl blocks + 80→443 redirect (same pattern as solution.resell-lausanne.ch).

limit_req_zone $binary_remote_addr zone=sgtm_per_ip:10m rate=30r/s;

server {
    listen 80;
    server_name sgtm.resell-lausanne.ch;

    client_max_body_size 1m;
    access_log /var/log/nginx/sgtm.access.log;
    error_log /var/log/nginx/sgtm.error.log warn;

    location = /healthz {
        proxy_pass http://127.0.0.1:8090/healthz;
        access_log off;
    }

    location / {
        limit_req zone=sgtm_per_ip burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # sGTM derives client IP / geo from X-Forwarded-For.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}

server {
    listen 80;
    server_name sgtm-preview.resell-lausanne.ch;

    client_max_body_size 1m;
    access_log /var/log/nginx/sgtm-preview.access.log;

    location / {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
