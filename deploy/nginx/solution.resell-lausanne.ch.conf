# solution.resell-lausanne.ch — reverse proxy in front of docker `web` (:3000).
# Install on VPS: copy to /etc/nginx/sites-available/resell + symlink sites-enabled, then nginx -t && systemctl reload nginx.
#
# Partner CSV ingest (NER / multi_sync) can be 200–400MB at ~1.7M offer lines.
# Default 50m → HTTP 413 Request Entity Too Large (seen 2026-10-28 02:46 UTC).

server {
    server_name solution.resell-lausanne.ch;
    # Global default for this vhost (non-/api uploads, etc.)
    client_max_body_size 50m;

    location /shopify-status/ {
        proxy_pass http://127.0.0.1:5001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /shopify-status {
        return 301 /shopify-status/;
    }

    location /stockx-vnc/ {
        proxy_pass http://127.0.0.1:6080/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Partner catalog CSV (NER multi_sync → /api/partners/uploads). Must exceed ~400MB.
    location /api/partners/uploads {
        client_max_body_size 512m;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        client_max_body_size 50m;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_connect_timeout 60s;
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection upgrade;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/solution.resell-lausanne.ch/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/solution.resell-lausanne.ch/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = solution.resell-lausanne.ch) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name solution.resell-lausanne.ch;
    listen 80;
    return 404; # managed by Certbot
}
