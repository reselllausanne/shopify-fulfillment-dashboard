name: Deploy VPS

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-char SHA to deploy (default: this workflow commit)"
        required: false
        type: string
      migrate:
        description: "Also run prisma migrate deploy (explicit)"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "VPS dry-run only (no build/up)"
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Dockerfile + compose config
        run: |
          set -euo pipefail
          chmod +x scripts/vps-deploy-from-github.sh scripts/vps-deploy-from-github.test.sh
          # compose env_file:.env is required for `docker compose config` but must not
          # contain production secrets in CI — empty placeholder only.
          if [ ! -f .env ]; then
            : >.env
            trap 'rm -f .env' EXIT
          fi
          bash scripts/vps-deploy-from-github.sh --validate-config
          bash scripts/vps-deploy-from-github.test.sh
          git fetch --no-tags origin main:refs/remotes/origin/main 2>/dev/null || true

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          WANT="${{ github.event.inputs.sha }}"
          if [ -z "$WANT" ]; then
            WANT="${{ github.sha }}"
          fi
          if ! [[ "$WANT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "FATAL: deploy SHA must be full 40-char hex, got: $WANT"
            exit 1
          fi
          echo "sha=$WANT" >> "$GITHUB_OUTPUT"
          echo "REQUESTED_SHA=$WANT"

      - name: Check deploy secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=0
          [ -n "$SSH_HOST" ] || { echo "missing secret SSH_HOST"; missing=1; }
          [ -n "$SSH_USER" ] || { echo "missing secret SSH_USER"; missing=1; }
          [ -n "$SSH_PRIVATE_KEY" ] || { echo "missing secret SSH_PRIVATE_KEY"; missing=1; }
          if [ "$missing" -ne 0 ]; then
            echo "Add GitHub Actions secrets, then re-run. See docs/VPS-DEPLOY-RUNBOOK.md"
            exit 1
          fi

      - name: Deploy exact SHA on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 40m
          script: |
            set -euo pipefail
            cd /opt/resell
            WANT="${{ steps.target.outputs.sha }}"
            DRY_FLAG=""
            MIGRATE_FLAG=""
            if [ "${{ github.event.inputs.dry_run || false }}" = "true" ]; then
              DRY_FLAG="--dry-run"
            fi
            if [ "${{ github.event.inputs.migrate || false }}" = "true" ]; then
              MIGRATE_FLAG="--migrate"
            fi
            echo "CI_REQUESTED_SHA=$WANT dry_run=${{ github.event.inputs.dry_run || false }} migrate=${{ github.event.inputs.migrate || false }}"
            # Script owns fetch + detach checkout + flock + compose (no git pull).
            # Prefer script from REQUESTED SHA after fetch so deploy logic matches that commit.
            git fetch origin --prune
            if ! git cat-file -e "${WANT}^{commit}" 2>/dev/null; then
              echo "FATAL: SHA $WANT missing after fetch"
              exit 11
            fi
            # Use deploy script content from the target SHA (deterministic), via git show,
            # so a broken old script on a previous detach cannot block upgrade.
            git show "${WANT}:scripts/vps-deploy-from-github.sh" > /tmp/vps-deploy-from-github.sh
            chmod +x /tmp/vps-deploy-from-github.sh
            EXPECTED_SHA="$WANT" bash /tmp/vps-deploy-from-github.sh --sha="$WANT" $DRY_FLAG $MIGRATE_FLAG
            echo "CI_RUNNING_SHA=$(git -C /opt/resell rev-parse HEAD)"
